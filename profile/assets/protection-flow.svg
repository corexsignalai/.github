<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="t d"><title id="t">CoreX Signal AI Active Protection Flow</title><desc id="d">Decision flow from market state through multi-timeframe analysis, AI decision, protection, risk planning and re-scanning.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#030810"/><stop offset="1" stop-color="#07141e"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#00f5c3"/><stop offset="1" stop-color="#41d2ff"/></linearGradient><style>.H{font:800 28px Inter,Segoe UI,Arial,sans-serif;fill:#f3f8fb}.S{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#8fa7b7;letter-spacing:1px}.N{font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#00f5c3}.P{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#b8c8d2}.C{fill:#07141e;stroke:#1a4051;stroke-width:1.4}.A{fill:#08201e;stroke:#00d9aa;stroke-opacity:.6;stroke-width:1.6}.R{fill:#1b0d16;stroke:#ff4f72;stroke-opacity:.65;stroke-width:1.5}</style></defs><rect width="1600" height="430" rx="28" fill="url(#bg)"/><text x="48" y="58" class="H">Decision intelligence that can say “act”, “wait” or “do not enter”.</text><text x="48" y="87" class="S">ACTIVE PROTECTION · EXPLAINABLE VETO · AUTO RE-SCANNING · PROFILE-AWARE RISK CONTEXT</text><line x1="110" y1="218" x2="1490" y2="218" stroke="#173a49" stroke-width="4"/><line x1="110" y1="218" x2="490" y2="218" stroke="url(#a)" stroke-width="4"/><g transform="translate(52 145)"><rect width="220" height="146" rx="16" class="C"/><text x="18" y="31" class="N">01 MARKET STATE</text><text x="18" y="61" class="P">Price · Bias · Regime</text><text x="18" y="84" class="P">Risk · Session · Quality</text><text x="18" y="116" class="N">LIVE CONTEXT</text></g><g transform="translate(312 145)"><rect width="220" height="146" rx="16" class="C"/><text x="18" y="31" class="N">02 COHERENCE</text><text x="18" y="61" class="P">9 timeframes</text><text x="18" y="84" class="P">BUY · SELL · HOLD</text><text x="18" y="116" class="N">MICRO → MACRO</text></g><g transform="translate(572 145)"><rect width="220" height="146" rx="16" class="A"/><text x="18" y="31" class="N">03 AI DECISION</text><text x="18" y="61" class="P">Action · rationale</text><text x="18" y="84" class="P">Score · expected value</text><text x="18" y="116" class="N">BUY / SELL / HOLD</text></g><g transform="translate(832 145)"><rect width="220" height="146" rx="16" class="R"/><text x="18" y="31" style="font:800 15px monospace;fill:#ff6077">04 ACTIVE PROTECTION</text><text x="18" y="61" class="P">Risk factor detected</text><text x="18" y="84" class="P">Entry can be blocked</text><text x="18" y="116" style="font:800 15px monospace;fill:#ff6077">VETO · RE-SCAN</text></g><g transform="translate(1092 145)"><rect width="220" height="146" rx="16" class="C"/><text x="18" y="31" class="N">05 RISK PLAN</text><text x="18" y="61" class="P">ATR · R:R · sizing</text><text x="18" y="84" class="P">SL · Entry · TP</text><text x="18" y="116" class="N">ANALYTICAL ONLY</text></g><g transform="translate(1352 145)"><rect width="196" height="146" rx="16" class="A"/><text x="18" y="31" class="N">06 EXPLAIN</text><text x="18" y="61" class="P">Factors · macro</text><text x="18" y="84" class="P">regime · history</text><text x="18" y="116" class="N">HUMAN READABLE</text></g><g transform="translate(52 328)"><rect width="1496" height="62" rx="14" fill="#06121a" stroke="#184354"/><text x="24" y="26" class="N">TRADE STYLE IMPACT</text><text x="210" y="26" class="P">⚡ Scalp · M1–M15</text><text x="430" y="26" class="P">📊 Day Trade · M30–H4</text><text x="690" y="26" class="P">🌊 Swing · H4–D1</text><text x="970" y="26" class="P">Caution · Blocked · Wait · Action</text><text x="24" y="48" class="S">The dashboard makes non-entry decisions visible instead of forcing a signal.</text></g></svg>